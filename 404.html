<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AIKING has moved to King AI</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://kingai.au/" />
    <meta http-equiv="refresh" content="0;url=https://kingai.au/" />
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 15vh auto; padding: 0 1.25rem; color: #111; }
      a { color: #1747BF; }
    </style>
  </head>
  <body>
    <p>AIKING has moved to <a id="dest" href="https://kingai.au/">kingai.au</a>.</p>
    <script>
      var dest = "https://kingai.au" + location.pathname + location.search + location.hash;
      var el = document.getElementById("dest");
      if (el) { el.href = dest; el.textContent = dest.replace(/^https:\/\//, ""); }
      location.replace(dest);
    </script>
  </body>
</html>
